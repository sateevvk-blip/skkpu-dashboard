<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- salary: монета с символом рубля -->
  <symbol id="icon-salary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 8h4a2 2 0 0 1 0 4H9m0 0h4.5M9 12v5m0-5V8"/>
  </symbol>

  <!-- teacher: фигура у доски -->
  <symbol id="icon-teacher" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="6" r="2.5"/>
    <path d="M3 19c0-3.314 2.239-5 5-5s5 1.686 5 5"/>
    <rect x="14" y="4" width="7" height="5" rx="1"/>
    <path d="M17 9v4m-1.5-2h3"/>
  </symbol>

  <!-- institution: здание-школа -->
  <symbol id="icon-institution" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21h18M5 21V9l7-5 7 5v12"/>
    <rect x="9" y="14" width="2.5" height="3.5" rx="0.4"/>
    <rect x="12.5" y="14" width="2.5" height="3.5" rx="0.4"/>
    <path d="M12 4v3"/>
  </symbol>

  <!-- chart-bar: столбчатая диаграмма -->
  <symbol id="icon-chart-bar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/>
    <rect x="4" y="13" width="3.5" height="7" rx="0.5"/>
    <rect x="10.25" y="8" width="3.5" height="12" rx="0.5"/>
    <rect x="16.5" y="4" width="3.5" height="16" rx="0.5"/>
  </symbol>

  <!-- trend-up: стрелка вверх по диагонали с точками -->
  <symbol id="icon-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3,17 9,11 13,15 21,7"/>
    <polyline points="16,7 21,7 21,12"/>
  </symbol>

  <!-- trend-down: стрелка вниз -->
  <symbol id="icon-trend-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3,7 9,13 13,9 21,17"/>
    <polyline points="16,17 21,17 21,12"/>
  </symbol>

  <!-- category: папка с вкладками -->
  <symbol id="icon-category" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
    <path d="M7 12h10M7 15h6"/>
  </symbol>

  <!-- region: контур территории -->
  <symbol id="icon-region" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6l4-2 4 3 4-3 4 2v12l-4-2-4 3-4-3-4 2V6z"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- calendar: прямоугольник с датой -->
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M3 10h18M8 3v4M16 3v4"/>
    <rect x="7" y="14" width="2" height="2" rx="0.3" fill="currentColor" stroke="none"/>
    <rect x="11" y="14" width="2" height="2" rx="0.3" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- info: кружок с «i» -->
  <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <line x1="12" y1="11" x2="12" y2="17"/>
    <circle cx="12" cy="7.5" r="0.8" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- map: контурная карта -->
  <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6l4-2 4 3 4-3 4 2v12l-4-2-4 3-4-3-4 2V6z"/>
  </symbol>

  <!-- people: две фигуры -->
  <symbol id="icon-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7" r="3"/>
    <path d="M2 21c0-3.866 3.134-6 7-6s7 2.134 7 6"/>
    <circle cx="18" cy="8" r="2.5"/>
    <path d="M22 21c0-2.761-1.79-4.5-4-4.5"/>
  </symbol>

  <!-- warning: треугольник с «!» -->
  <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
    <line x1="12" y1="9" x2="12" y2="14"/>
    <circle cx="12" cy="17.5" r="0.8" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- building: здание -->
  <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="13" height="14" rx="1"/>
    <path d="M15 9h5a1 1 0 0 1 1 1v11H15"/>
    <rect x="5" y="11" width="2.5" height="2.5" rx="0.3"/>
    <rect x="9.5" y="11" width="2.5" height="2.5" rx="0.3"/>
    <rect x="5" y="15.5" width="2.5" height="2.5" rx="0.3"/>
    <rect x="9.5" y="15.5" width="2.5" height="2.5" rx="0.3"/>
    <rect x="17" y="13" width="2" height="2" rx="0.3"/>
    <path d="M8 21v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3"/>
  </symbol>

  <!-- check: галочка в круге -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <polyline points="8,12.5 11,15.5 16,9"/>
  </symbol>

  <!-- subvention: документ с монетой -->
  <symbol id="icon-subvention" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/>
    <path d="M14 3v6h6"/>
    <circle cx="12" cy="15" r="3"/>
    <path d="M11 15h1.5a0.75 0.75 0 0 1 0 1.5H11m0 0h2M11 13.5v3"/>
  </symbol>

</svg>
